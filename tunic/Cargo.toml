[package]
name = "tunic"
version = "0.1.0"
edition = "2024"

[features]
application = []
cache = []
database = []

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
paste = "1.0.15"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8"
redb = "4.1.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
uuid = { version = "1.23.2", features = ["serde", "v7", "v4", "v5"] }
tunic-macro = { path = "../tunic-macro" }
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["compression-full"] }
sha2 = "0.11.0"
async-trait = "0.1.91"
typetag = "0.2.23"
tower = "0.5.3"
