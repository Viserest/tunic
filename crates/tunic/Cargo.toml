[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[dependencies]
proc-macro = { path = "../proc_macros" }

argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
bincode = "1.3.3"
paste = "1.0.15"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.8"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["compression-full"] }
tower = "0.5.3"
uuid = { version = "1.23.2", features = ["serde", "v4", "v5"] }
inventory = "0.3.24"
